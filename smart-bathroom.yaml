blueprint:
  name: "\U0001F6BD\U0001F4A1 Smart Bathroom Occupancy Light Control"
  author: Murat Çeşmecioğlu
  description: " __If a hornet enters a closed box – it’s trapped. If the box opens – it’s gone. Now apply that logic to your bathroom.__ \n\n\n
This blueprint lets you automate lights in bathrooms or toilets using door and motion sensors with military precision.\n\n
'Hornet in The Box' Principle: When the door closes (box sealed), occupancy is 100% certain. When it opens, the space is clear.\n\n
Perfect for triggering lights, exhaust fans, or even occupancy alerts in windowless rooms. \n\n
Why it’s bulletproof: Eliminates false triggers by cross-validating door + motion + time delays.\n\n
Read more: https://community.home-assistant.io/t/smart-bathroom-occupancy-light-control/874353"
  domain: automation
  source_url: https://github.com/muratcesmecioglu/ha-smart-bathroom/blob/main/smart-bathroom.yaml
  input:
    motion_sensor:
      name: Motion/Occupancy Sensor
      description: Motion or occupancy sensor in the bathroom
      selector:
        entity:
          filter:
            domain: binary_sensor
            device_class: 
              - motion
              - occupancy
    door_sensor:
      name: Door Sensor
      description: Door sensor for the bathroom
      selector:
        entity:
          filter:
            domain: binary_sensor
    light_entity:
      name: Light or Switch
      description: The light or switch to control
      selector:
        entity:
          filter:
            domain: 
              - light
              - switch
    occupied_helper:
      name: Bathroom Occupied Helper
      description: Input boolean to track if bathroom is occupied
      selector:
        entity:
          filter:
            domain: input_boolean
    entering_helper:
      name: Entering Helper
      description: Input boolean to track entering state
      selector:
        entity:
          filter:
            domain: input_boolean
    entered_helper:
      name: Entered Helper
      description: Input boolean to track entered state
      selector:
        entity:
          filter:
            domain: input_boolean
    exiting_helper:
      name: Exiting Helper
      description: Input boolean to track exiting state
      selector:
        entity:
          filter:
            domain: input_boolean
    motion_timeout:
      name: Motion/Occupancy Timeout
      description: How long to wait after motion/occupancy stops before turning off light (when bathroom is empty)
      default: 25
      selector:
        number:
          min: 5
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: slider

alias: Smart Bathroom Occupancy Light Control
description: ""
triggers:
  - trigger: state
    entity_id: !input motion_sensor
    id: motion_sensor_on
    from: "off"
    to: "on"
  - trigger: state
    entity_id: !input motion_sensor
    id: motion_sensor_off
    from: "on"
    to: "off"
  - trigger: state
    entity_id: !input door_sensor
    id: door_sensor_on
    from: "off"
    to: "on"
  - trigger: state
    entity_id: !input door_sensor
    id: door_sensor_off
    from: "on"
    to: "off"
conditions: []
variables:
  light_entity: !input light_entity
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - door_sensor_on
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input occupied_helper
                    state: "on"
                sequence:
                  - if:
                      - condition: state
                        entity_id: !input light_entity
                        state: "off"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ light_entity.startswith('light.') }}"
                        then:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                        else:
                          - action: switch.turn_on
                            target:
                              entity_id: !input light_entity
                    alias: Door Opens When Bathroom Occupied but Light Off -> Turn On Light
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input exiting_helper
                    alias: Started Exiting
                alias: Door Opens When Bathroom Occupied -> Exiting
              - conditions:
                  - condition: state
                    entity_id: !input occupied_helper
                    state: "off"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input entering_helper
                    alias: Started Entering
                  - if:
                      - condition: template
                        value_template: "{{ light_entity.startswith('light.') }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                    else:
                      - action: switch.turn_on
                        target:
                          entity_id: !input light_entity
                alias: Door Opens When Bathroom Empty -> Entering
            enabled: true
        alias: When Door Opens
      - conditions:
          - condition: trigger
            id:
              - door_sensor_off
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input entered_helper
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input occupied_helper
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input entered_helper
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input exiting_helper
                alias: Door Closes When Entered -> Bathroom Occupied
              - conditions:
                  - condition: state
                    entity_id: !input exiting_helper
                    state: "on"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input occupied_helper
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input exiting_helper
                alias: Door Closes When Exiting
            enabled: true
          - alias: Door Closes When Bathroom Empty -> Turn Off Light
            if:
              - condition: state
                entity_id: !input occupied_helper
                state: "off"
            then:
              - wait_for_trigger:
                  - trigger: state
                    entity_id: !input motion_sensor
                    to: "off"
                    from: "on"
                timeout:
                  seconds: !input motion_timeout
                continue_on_timeout: false
              - if:
                  - condition: template
                    value_template: "{{ light_entity.startswith('light.') }}"
                then:
                  - action: light.turn_off
                    target:
                      entity_id: !input light_entity
                else:
                  - action: switch.turn_off
                    target:
                      entity_id: !input light_entity
              - action: input_boolean.turn_off
                target:
                  entity_id: !input entering_helper
              - action: input_boolean.turn_off
                target:
                  entity_id: !input exiting_helper
        alias: When Door Closes
      - conditions:
          - condition: trigger
            id:
              - motion_sensor_on
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input entering_helper
                    state: "on"
                sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input entered_helper
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input entering_helper
                alias: Motion Detected When Entering -> Entered
              - conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: !input exiting_helper
                        state: "on"
                      - condition: state
                        entity_id: !input entered_helper
                        state: "on"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ light_entity.startswith('light.') }}"
                    then:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                    else:
                      - action: switch.turn_on
                        target:
                          entity_id: !input light_entity
                  - action: input_boolean.turn_on
                    target:
                      entity_id: !input entered_helper
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input exiting_helper
                    enabled: true
                alias: Door Open When Entered
          - alias: Motion When Door Closed -> Turn On Light, Set Occupied
            if:
              - condition: state
                entity_id: !input door_sensor
                state: "off"
                enabled: true
            then:
              - if:
                  - condition: template
                    value_template: "{{ light_entity.startswith('light.') }}"
                then:
                  - action: light.turn_on
                    target:
                      entity_id: !input light_entity
                else:
                  - action: switch.turn_on
                    target:
                      entity_id: !input light_entity
              - action: input_boolean.turn_on
                target:
                  entity_id: !input occupied_helper
        alias: When Motion Starts
      - conditions:
          - condition: trigger
            id:
              - motion_sensor_off
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input occupied_helper
                    state: "off"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ light_entity.startswith('light.') }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: !input light_entity
                    else:
                      - action: switch.turn_off
                        target:
                          entity_id: !input light_entity
                alias: Motion Stops When Bathroom Empty -> Turn Off Light
              - conditions:
                  - condition: state
                    entity_id: !input exiting_helper
                    state: "on"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ light_entity.startswith('light.') }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: !input light_entity
                    else:
                      - action: switch.turn_off
                        target:
                          entity_id: !input light_entity
                  - action: input_boolean.turn_off
                    target:
                      entity_id: !input occupied_helper
                alias: Motion Stops When Exiting
              - conditions:
                  - condition: state
                    entity_id: !input entered_helper
                    state: "on"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ light_entity.startswith('light.') }}"
                    then:
                      - action: light.turn_off
                        target:
                          entity_id: !input light_entity
                    else:
                      - action: switch.turn_off
                        target:
                          entity_id: !input light_entity
                  - action: input_boolean.turn_off
                    target:
                      entity_id:
                        - !input exiting_helper
                        - !input entered_helper
                alias: Entered But No Motion = Entered and Left?
        alias: When Motion Stops
mode: restart
